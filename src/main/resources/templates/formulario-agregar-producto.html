<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Productos - Agregar</title>
</head>
<body>
<h1>Productos - Agregar</h1>
<a th:href="@{/producto}">Regresar</a>
<form th:action="@{/producto}" th:object="${producto}" method="post">
    <p>Nombre: <br/>
        <input type="text" th:field="*{nombre}" required />
    </p>
    <p>Precio: <br/>
        <input type="number" step="0.01" th:field="*{precio}" required />
    </p>
    <p>Categoría: <br/>
        <select th:field="*{categoria}">
            <option th:each="cat : ${categorias}"
                    th:value="${cat.nombre}"
                    th:text="${cat.nombre}">
            </option>
        </select>
    </p>
    <button type="submit">Guardar</button>
</form>
</body>
</html>
